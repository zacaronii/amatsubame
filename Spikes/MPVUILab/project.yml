# Spike (never merged): the engine lab with MPVUI alone (see App/MPVUILabApp.swift).
name: MPVUILab
options:
  bundleIdPrefix: com.amatsubame
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
configFiles:
  Debug: ../../Config/Signing.xcconfig
  Release: ../../Config/Signing.xcconfig
packages:
  PlayerEngine:
    path: ../../Packages/PlayerEngine
  MPVUI:
    url: https://github.com/LePips/MPVUI
    exactVersion: 0.11.0
targets:
  MPVUIBridge:
    type: framework
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources: [../../MPVUIBridge]
    dependencies:
      - package: MPVUI
        product: MPVUI
      - package: PlayerEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mpvuilab.bridge
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  MPVUILab:
    type: application
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - App
      - ../../Miru/EngineLab/EngineLab.swift
    dependencies:
      - target: MPVUIBridge
      - package: PlayerEngine
    postCompileScripts:
      # MPVUI's Libmpv.framework (mpv + FFmpeg, dynamic) goes in with the bridge that links it.
      - name: Embed Libmpv
        basedOnDependencyAnalysis: false
        script: |
          set -e
          dest="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$dest"
          rm -rf "$dest/Libmpv.framework"
          cp -R "$BUILT_PRODUCTS_DIR/Libmpv.framework" "$dest/"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dest/Libmpv.framework" || true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).mpvuilab
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: $(inherited) @executable_path/../Frameworks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIBackgroundModes: audio
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
